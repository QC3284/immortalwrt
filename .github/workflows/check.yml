# Static tree gate for the e2631 fork of ImmortalWrt (QC3284/immortalwrt, branch e2631).
#
# Cheap on purpose: it proves this branch is *the expected tree* - the pinned
# ImmortalWrt base, the four zx279128 port commits producing the pinned tree
# hash, the E2631 device/package files, and a usable seed config - without
# building anything. The full world build and firmware packaging live in the
# distribution kit (QC3284/zte-e2631-immortalwrt).
#
# History policy: the 2026-11-21 rebuild (plan C) recreated the e2631 series on
# the ImmortalWrt side; the pre-rebuild history is kept on branch e2631-legacy.
name: Tree static checks

on:
  push:
    branches: [ e2631 ]
  pull_request:
    branches: [ e2631 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2631-tree-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin, mirrored from the kit base/commits.env triple pin:
  # immortalwrt/immortalwrt master @ 2026-11-14, kernel 6.18.60.
  E2631_IW_SHA: a4ba8240d8a1aaef7e8c6f2d65e841a9bfd2b8c5
  # The tree the four port commits must produce.  This is the invariant that
  # replaces the pre-rebuild 4f89aa7ad0a5132dc047a27a9073b43916f0f957.
  E2631_PORT_TREE_SHA: 6136bd92d5259dbaf22f6bca02c675f05abdf86b

jobs:
  static:
    name: Static tree gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for the port-commit assertions)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert the pinned ImmortalWrt base is an ancestor
        run: |
          set -eu
          git cat-file -e "${E2631_IW_SHA}^{commit}" 2>/dev/null || {
            echo "pinned ImmortalWrt commit ${E2631_IW_SHA} is missing" >&2; exit 1; }
          git merge-base --is-ancestor "${E2631_IW_SHA}" HEAD || {
            echo "pinned base ${E2631_IW_SHA} is not an ancestor of ${GITHUB_SHA}" >&2; exit 1; }

      - name: Assert the four zx279128 port commits are present
        run: |
          set -eu
          subjects=$(git log --format=%s)
          want() {
            if ! printf '%s\n' "$subjects" | grep -qxF "$1"; then
              echo "missing port commit subject: $1" >&2; exit 1
            fi
          }
          want 'zx279128: add generic DWC3 platform glue driver'
          want 'mt76: serialize device reads with outer cache maintenance'
          want 'zx279128: add ZX279128S target'
          want 'zx279128: add support for ZTE ZXHN H3600'

      - name: Assert the four port commits produce the pinned tree hash
        run: |
          set -eu
          fourth=$(git log --format='%H %s' | awk '$0 ~ / zx279128: add support for ZTE ZXHN H3600$/ {print $1; exit}')
          test -n "$fourth" || { echo "cannot find the fourth port commit" >&2; exit 1; }
          tree=$(git rev-parse "$fourth^{tree}")
          test "$tree" = "${E2631_PORT_TREE_SHA}" || {
            echo "port series tree $tree != pinned ${E2631_PORT_TREE_SHA}" >&2; exit 1; }

      - name: Assert no stale sanechips target references remain
        run: |
          set -eu
          # The plan-C rename was the hazard: a stale target dependency does not
          # break the build, it silently hides a package from defconfig. Keep
          # the tree clean; the CI files themselves name the pattern, so skip
          # .github (this workflow is the only allowed carrier).
          if git grep -nE '@TARGET_sanechips|CONFIG_TARGET_sanechips' -- . ':!:.github'; then
            echo "stale sanechips target reference(s) above" >&2
            exit 1
          fi

      - name: Assert the e2631 tree files are present
        run: |
          set -eu
          for f in \
            target/linux/zx279128/Makefile \
            target/linux/zx279128/config-6.18 \
            target/linux/zx279128/image/Makefile \
            target/linux/zx279128/dts/zx279128s-zte-zxhn-h3600.dts \
            target/linux/zx279128/dts/zx279128s-zte-zxhn-e2631.dts \
            target/linux/zx279128/base-files/etc/config/wireless \
            target/linux/zx279128/base-files/lib/upgrade/platform.sh \
            package/e2631/e2631-fwslot/Makefile \
            package/e2631/luci-app-e2631/Makefile \
            seed/e2631.config
          do
            test -f "$f" || { echo "missing tree file: $f" >&2; exit 1; }
          done
          # The e2631 image recipe is merged into image/Makefile (D5); the old
          # separate file must never come back.
          test ! -e target/linux/zx279128/image/Makefile.e2631 || {
            echo "target/linux/zx279128/image/Makefile.e2631 must not exist" >&2; exit 1; }

      - name: Assert the generic kernel-config flips are present
        run: |
          set -eu
          grep -qx 'CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=25' target/linux/generic/config-6.18
          grep -qx 'CONFIG_DETECT_HUNG_TASK=y' target/linux/generic/config-6.18
          grep -qx 'CONFIG_SOFTLOCKUP_DETECTOR=y' target/linux/generic/config-6.18

      - name: Install defconfig prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gawk gettext libncurses-dev libssl-dev \
            python3 rsync unzip wget zstd

      - name: Install the feeds the seed selects from
        run: |
          set -eu
          # The luci-app-* packages live in feeds/luci: their PACKAGE_* symbols
          # only exist after the feeds are installed. Without this the seed's
          # luci apps silently vanish from defconfig and the package guard in
          # the next step would be vacuous for them. The build itself still
          # consumes the pinned feed commits; this is a metadata-only install.
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a

      - name: Copy the seed config and run make defconfig
        run: |
          set -eu
          # DEVMEM is decided by this top-level CONFIG_KERNEL_* request: the
          # kernel build appends every CONFIG_KERNEL_* line after the merged
          # config (last-wins), so losing this one silently removes /dev/mem
          # and breaks /sbin/e2631-fwstate.
          grep -qx 'CONFIG_KERNEL_DEVMEM=y' seed/e2631.config
          cp seed/e2631.config .config
          make defconfig
          grep -q '^CONFIG_KERNEL_DEVMEM=y$' .config
          grep -q '^CONFIG_TARGET_zx279128=y$' .config
          grep -q '^CONFIG_TARGET_zx279128_generic=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_zx279128_generic_DEVICE_zte_zxhn-e2631=y$' .config
          # The stale @TARGET_sanechips dependency regression removed these two
          # packages from the resolved seed config without failing anything.
          grep -q '^CONFIG_PACKAGE_zte-mesh=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-zte-mesh=y$' .config
          echo "make defconfig: OK"

  image-expansion:
    name: Image pipeline expansion check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse the image makefiles and assert the check-size pipeline
        # RUN6 v2 shipped a kernel pipeline whose check-size stage expanded to an
        # empty limit and the build stayed green. This parse-only gate (make -pn,
        # no build) keeps the escaping, the 4096k value and the two non-empty
        # invocations honest.
        run: bash scripts/check-e2631-image-expansion.sh

  checkpatch:
    name: Per-commit checkpatch gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for the per-commit checkpatch run)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run checkpatch on every e2631 commit since the pinned base
        # scripts/check-e2631-checkpatch.sh parses the machine-readable
        # exemption table in docs/checkpatch-exemptions.md, so the documented
        # exemptions and the enforced ones are the same bytes.
        run: bash scripts/check-e2631-checkpatch.sh
